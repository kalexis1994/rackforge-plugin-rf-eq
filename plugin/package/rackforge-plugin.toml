schema_version = 3
id = "org.rackforge.rf-eq"
name = "RF-EQ"
short_name = "RF-EQ"
vendor = "RackForge Community"
version = "0.2.0"
description = "An eight-band parametric equaliser with high-pass and low-pass filters, shelves, four fully parametric peaks, output trim and bypass."
kind = "effect"
state_version = 2
capabilities = [
    "audio_input",
    "audio_output",
    "presets",
    "state",
    "sample_accurate_automation",
]
config_mode = false

[audio]
input_buses = [{ id = "main", name = "In", channels = 2, layout = "stereo" }]
output_buses = [{ id = "main", name = "Out", channels = 2, layout = "stereo" }]

[web_ui]
api_version = 1

[[web_ui.surfaces]]
kind = "play"
entry = "web/play.html"

[api]
major = 1
minor = 9

[branding]
icon = "branding/icon.png"
banner = "branding/banner.png"
splash = "branding/splash.png"
background_color = "#0E1216"
accent_color = "#2EC4B6"

[component]
abi = "wasm-v1"
path = "component.wasm"
runtime_descriptor = "metadata/runtime.json"
parameter_schema = "metadata/parameters.json"
preset_catalog = "metadata/presets.json"
