<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RF-EQ</title>
    <style>
      :root {
        --panel: #0e1216;
        --panel-light: #161c22;
        --enclosure: #1f262d;
        --enclosure-edge: #36404a;
        --ink: #e8ecef;
        --muted: #8b96a0;
        --accent: #2ec4b6;
        --accent-dim: #155a53;
        --accent-sweep: #1e8f84;
        --steel: #aeb6bd;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        background:
          radial-gradient(120% 80% at 50% -10%, #1b232b 0%, var(--panel) 60%),
          repeating-linear-gradient(0deg, #10151a 0 3px, #0d1216 3px 6px);
        color: var(--ink);
        font-family: "Segoe UI", Roboto, system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      header {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 14px 20px 10px;
        border-bottom: 1px solid #222a32;
        flex-wrap: wrap;
      }

      header label {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      header select {
        min-width: 0;
        max-width: 100%;
      }

      .wordmark {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.12em;
      }

      .subtitle {
        color: var(--accent);
        font-size: 12px;
        letter-spacing: 0.04em;
      }

      .spacer {
        flex: 1;
      }

      select,
      button {
        font: inherit;
        color: var(--ink);
        background: var(--enclosure);
        border: 1px solid var(--enclosure-edge);
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
      }

      select:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      main {
        flex: 1;
        overflow: auto;
        padding: 18px 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: flex-start;
        align-content: flex-start;
      }

      .response-panel {
        position: relative;
        margin: 14px 20px 0;
        min-height: 170px;
        height: clamp(170px, 28vh, 260px);
        border: 1px solid var(--enclosure-edge);
        border-radius: 16px;
        overflow: hidden;
        background:
          radial-gradient(80% 120% at 50% 100%, #17373355, transparent 72%),
          linear-gradient(180deg, #131a20, #0c1115);
        box-shadow: inset 0 1px #ffffff0a, 0 10px 24px #0006;
      }

      .response-panel svg {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      .response-grid line {
        stroke: #52606a33;
        stroke-width: 1;
        vector-effect: non-scaling-stroke;
      }

      .response-grid line.zero {
        stroke: #aeb6bd66;
      }

      .response-grid text {
        fill: var(--muted);
        font-size: 12px;
        font-family: "Segoe UI", Roboto, system-ui, sans-serif;
      }

      .response-fill {
        fill: url(#response-gradient);
        opacity: 0.22;
      }

      .response-curve {
        fill: none;
        stroke: var(--accent);
        stroke-width: 3;
        vector-effect: non-scaling-stroke;
        filter: drop-shadow(0 0 5px #2ec4b688);
      }

      .response-node {
        cursor: grab;
        outline: none;
      }

      .response-node:active {
        cursor: grabbing;
      }

      .response-node circle {
        fill: #172127;
        stroke: var(--node-color, var(--accent));
        stroke-width: 3;
        vector-effect: non-scaling-stroke;
      }

      .response-node.off circle {
        fill: #172127;
        stroke-dasharray: 4 3;
        opacity: 0.58;
      }

      .response-node.held circle,
      .response-node:focus-visible circle {
        fill: var(--node-color, var(--accent));
        stroke: white;
      }

      .response-node text {
        fill: white;
        font: 700 12px "Segoe UI", Roboto, system-ui, sans-serif;
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
      }

      .response-caption {
        position: absolute;
        top: 10px;
        left: 14px;
        display: flex;
        gap: 10px;
        align-items: baseline;
        pointer-events: none;
      }

      .response-caption strong {
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .response-caption span {
        color: var(--muted);
        font-size: 10px;
      }

      .group {
        flex: 1 1 320px;
        background: linear-gradient(180deg, #262e36 0%, var(--enclosure) 42%, #1a2026 100%);
        border: 1px solid var(--enclosure-edge);
        border-radius: 16px;
        padding: 12px 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-shadow: 0 10px 24px #0008;
      }

      .group[data-page="filters"] {
        flex: 3 1 700px;
      }

      .group[data-page="output"] {
        flex: 1 1 220px;
      }

      .group-name {
        font-weight: 700;
        letter-spacing: 0.08em;
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
      }

      .knobs {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 8px;
        align-items: flex-end;
      }

      /* One band's controls, side by side, with the band's name above. */
      .strip {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 6px 8px 8px;
        border: 1px solid #2a323a;
        border-radius: 12px;
        background: #1a2026aa;
      }

      .strip-name {
        font-size: 10px;
        color: var(--accent);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .strip .knobs {
        flex-wrap: nowrap;
      }

      .knob {
        width: 70px;
        text-align: center;
        touch-action: none;
        user-select: none;
      }

      .knob.wide {
        width: auto;
        min-width: 70px;
      }

      .knob svg {
        display: block;
        margin: 0 auto;
        cursor: ns-resize;
      }

      .knob svg:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
        border-radius: 50%;
      }

      .knob-body {
        fill: #2a3239;
        stroke: var(--enclosure-edge);
        stroke-width: 1.5;
      }

      .knob svg.held .knob-body {
        stroke: var(--accent);
      }

      .knob-sweep {
        stroke: var(--accent-sweep);
        stroke-width: 2.5;
        stroke-linecap: round;
      }

      .knob svg.held .knob-sweep {
        stroke: var(--accent);
      }

      .knob-pointer {
        stroke: var(--steel);
        stroke-width: 2.5;
        stroke-linecap: round;
      }

      .knob svg.held .knob-pointer {
        stroke: var(--ink);
      }

      .knob .label {
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .knob .reading {
        font-size: 10px;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }

      .toggle {
        width: 100%;
        height: 46px;
        margin-bottom: 4px;
        border-radius: 10px;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .toggle[aria-pressed="true"] {
        background: var(--accent-dim);
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent), 0 0 12px 1px #2ec4b655;
      }

      .choice {
        display: flex;
        gap: 4px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .choice button {
        padding: 3px 8px;
        font-size: 11px;
        border-radius: 6px;
      }

      .choice button[aria-pressed="true"] {
        background: var(--accent-dim);
        border-color: var(--accent);
        color: var(--ink);
      }

      .status {
        padding: 6px 20px 10px;
        font-size: 11px;
        color: var(--muted);
        border-top: 1px solid #222a32;
        min-height: 28px;
      }

      .status.error {
        color: #e57373;
      }

      @media (max-width: 680px) {
        header {
          padding: 10px 12px 8px;
          gap: 10px;
        }

        .wordmark {
          font-size: 18px;
        }

        header label {
          flex: 1 1 100%;
        }

        header select {
          flex: 1;
          width: 0;
        }

        .response-panel {
          margin: 10px 10px 0;
          height: 190px;
        }

        main {
          padding: 10px;
          gap: 10px;
        }

        .group {
          flex-basis: 100%;
          padding-inline: 10px;
        }

        .strip {
          flex: 1 1 210px;
        }

        .strip .knobs {
          flex-wrap: wrap;
          justify-content: center;
        }

        .knob {
          width: 64px;
        }
      }

      @media (max-width: 480px) {
        .strip {
          flex-basis: 100%;
          min-width: 0;
        }

        .strip .knobs {
          flex-wrap: nowrap;
          justify-content: space-evenly;
        }

        .response-caption span {
          font-size: 9px;
        }
      }

      @media (max-height: 620px) and (min-width: 681px) {
        .response-panel {
          height: 150px;
          min-height: 150px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <div class="wordmark">RF-EQ</div>
        <div class="subtitle">Eight-band parametric equaliser</div>
      </div>
      <div class="spacer"></div>
      <label>
        <span class="subtitle">Setting</span>
        <select id="presets" aria-label="Factory setting"></select>
      </label>
    </header>

    <section class="response-panel" aria-label="Interactive frequency response">
      <div class="response-caption">
        <strong>Response</strong>
        <span>Drag nodes · wheel adjusts Q</span>
      </div>
      <svg id="response" viewBox="0 0 1000 260" preserveAspectRatio="none" role="img" aria-label="Equaliser response from 20 hertz to 20 kilohertz">
        <defs>
          <linearGradient id="response-gradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2ec4b6" />
            <stop offset="1" stop-color="#2ec4b6" stop-opacity="0" />
          </linearGradient>
        </defs>
        <g class="response-grid" id="response-grid"></g>
        <path class="response-fill" id="response-fill"></path>
        <path class="response-curve" id="response-curve"></path>
        <g id="response-nodes"></g>
      </svg>
    </section>

    <main id="panel"></main>

    <div class="status" id="status" role="status" aria-live="polite">
      Connecting to RackForge…
    </div>

    <script src="play.js"></script>
  </body>
</html>
